name: Salud de Supabase

# Cada 3 días consulta la API: mantiene activo el proyecto gratis (Supabase lo pausa tras 7 días sin uso) y, si Supabase no
# responde, el workflow falla y GitHub avisa por correo. Usa las mismas variables públicas con las que se compila la app.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la API
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Faltan las variables VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY"; exit 1; fi
          for path in "/auth/v1/health" "/rest/v1/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H "apikey: $KEY" "$URL$path")
            echo "$path respondió $code"
            if [ "$code" != "200" ]; then exit 1; fi
          done
